syntax = "proto3";
package io.highstate.runtime.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";

// ClientHello registers one runtime-aware workload with the backend.
message ClientHello {
  // The lowest runtime protocol version supported by the workload.
  uint32 minimum_protocol_version = 1 [(google.api.field_behavior) = REQUIRED];

  // The highest runtime protocol version supported by the workload.
  uint32 maximum_protocol_version = 2 [(google.api.field_behavior) = REQUIRED];

  // The backend ID from the workload credential scope.
  string backend_id = 3 [(google.api.field_behavior) = REQUIRED];

  // The project ID from the workload credential scope.
  string project_id = 4 [(google.api.field_behavior) = REQUIRED];

  // The selected container runtime ID.
  string container_runtime_id = 5 [(google.api.field_behavior) = REQUIRED];

  // The runtime-assigned workload ID.
  string workload_id = 6 [(google.api.field_behavior) = REQUIRED];

  // The workload role.
  WorkloadKind workload_kind = 7 [(google.api.field_behavior) = REQUIRED];

  // Capabilities implemented by the workload agent.
  repeated RuntimeCapability capabilities = 8;

  // The authorized lease generation from the signed workload credential.
  uint64 lease_generation = 9 [(google.api.field_behavior) = REQUIRED];
}

// ServerHello accepts a workload and establishes its renewable lease.
message ServerHello {
  // The negotiated runtime protocol version.
  uint32 protocol_version = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The lease duration in milliseconds.
  uint64 lease_duration_ms = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The accepted lease generation that fences older credentials and streams.
  uint64 lease_generation = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// WorkloadKind identifies the domain role of a connected workload.
enum WorkloadKind {
  // The workload kind was not specified or is not recognized.
  WORKLOAD_KIND_UNSPECIFIED = 0;

  // The workload runs Pulumi operations and unit programs.
  WORKLOAD_KIND_PULUMI = 1;

  // The workload hosts a supervised worker version.
  WORKLOAD_KIND_WORKER = 2;

  // The workload evaluates project composite instances.
  WORKLOAD_KIND_COMPOSITE_EVALUATION = 3;
}

// RuntimeCapability identifies an operation supported by a workload agent.
enum RuntimeCapability {
  // The capability was not specified or is not recognized.
  RUNTIME_CAPABILITY_UNSPECIFIED = 0;

  // The agent can run Pulumi actions.
  RUNTIME_CAPABILITY_PULUMI_ACTIONS = 1;

  // The agent can request and execute unit configuration.
  RUNTIME_CAPABILITY_UNIT_EXECUTION = 2;

  // The agent can request operation-scoped sidecars.
  RUNTIME_CAPABILITY_SIDECARS = 3;

  // The agent supports worker registration and control traffic.
  RUNTIME_CAPABILITY_WORKER = 4;

  // The agent can evaluate project composite instances.
  RUNTIME_CAPABILITY_COMPOSITE_EVALUATION = 5;
}

// Heartbeat renews the workload lease and reports its local monotonic sequence.
message Heartbeat {
  // A monotonically increasing sequence generated by the sender.
  uint64 sequence = 1;
}

// ActionOutput carries ordered process output for one action.
message ActionOutput {
  // The output channel.
  OutputChannel channel = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The unmodified output bytes.
  bytes data = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// OutputChannel identifies a process output stream.
enum OutputChannel {
  // The channel was not specified or is not recognized.
  OUTPUT_CHANNEL_UNSPECIFIED = 0;

  // Standard output.
  OUTPUT_CHANNEL_STDOUT = 1;

  // Standard error.
  OUTPUT_CHANNEL_STDERR = 2;
}

// ActionCompleted reports successful completion of a command action.
message ActionCompleted {
  // The process exit code.
  int32 exit_code = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Action-specific structured result data.
  optional google.protobuf.Struct result = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// RuntimeError terminates the envelope's request when request_id is set, otherwise its action.
// Connection failures use the gRPC status rather than a runtime event.
message RuntimeError {
  // A stable machine-readable error code.
  string code = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // A human-readable error description.
  string message = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Structured error details when available.
  optional google.protobuf.Struct details = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// CancelRequest requests termination of the envelope's action; the backend fans operation cancellation out to actions.
message CancelRequest {
  // Whether to skip graceful interruption and force termination immediately.
  bool force = 2;
}

// CancelResponse reports whether the targeted work accepted cancellation.
message CancelResponse {
  // Whether cancellation was accepted for active work.
  bool accepted = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}
