syntax = "proto3";
package io.highstate.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";

// GetSecretContentRequest requests dynamic content for one authorized secret.
message GetSecretContentRequest {
  // The project ID.
  string project_id = 1 [(google.api.field_behavior) = REQUIRED];

  // The stable secret ID.
  string secret_id = 2 [(google.api.field_behavior) = REQUIRED];
}

// GetSecretContentResponse returns component-owned secret content.
message GetSecretContentResponse {
  // The dynamic secret content.
  google.protobuf.Value content = 1 [(google.api.field_behavior) = REQUIRED];
}

// SecretService provides explicitly authorized access to dynamic secret content.
service SecretService {
  // Gets the dynamic content of one authorized secret.
  rpc GetSecretContent(GetSecretContentRequest) returns (GetSecretContentResponse);
}
