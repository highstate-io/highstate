syntax = "proto3";
package io.highstate.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";

// GetSecretContentRequest requests dynamic content for one authorized secret.
message GetSecretContentRequest {
  // The project ID.
  string project_id = 1 [(google.api.field_behavior) = REQUIRED];

  // The stable secret ID.
  string secret_id = 2 [(google.api.field_behavior) = REQUIRED];
}

// GetSecretContentResponse returns component-owned secret content.
message GetSecretContentResponse {
  // The dynamic secret content.
  google.protobuf.Value content = 1 [(google.api.field_behavior) = REQUIRED];
}

// SecretService provides explicitly authorized access to dynamic secret content.
service SecretService {
  // Lists authorized secret metadata without values.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);

  // Gets authorized metadata without the secret value.
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);

  // Gets the dynamic content of one authorized secret.
  rpc GetSecretContent(GetSecretContentRequest) returns (GetSecretContentResponse);

  // Replaces one existing named unit secret and invalidates its unit inputs.
  rpc UpdateSecretContent(UpdateSecretContentRequest) returns (UpdateSecretContentResponse);

  // Gets all named secret values for one unit instance.
  rpc GetInstanceSecrets(GetInstanceSecretsRequest) returns (GetInstanceSecretsResponse);

  // Updates supplied unit secrets while preserving omitted names.
  rpc UpdateInstanceSecrets(UpdateInstanceSecretsRequest) returns (UpdateInstanceSecretsResponse);
}

// UpdateSecretContentRequest replaces an existing unit secret with component-owned metadata.
message UpdateSecretContentRequest {
  // The project ID.
  string project_id = 1 [(google.api.field_behavior) = REQUIRED];
  // The stable secret ID.
  string secret_id = 2 [(google.api.field_behavior) = REQUIRED];
  // The replacement JSON value, including explicit null.
  google.protobuf.Value content = 3 [(google.api.field_behavior) = REQUIRED];
}

// UpdateSecretContentResponse acknowledges the update without echoing its value.
message UpdateSecretContentResponse {}

// ListSecretsRequest selects authorized metadata in a project.
message ListSecretsRequest {
  // The project ID.
  string project_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Optional instance state filter.
  optional string state_id = 2;
  // Optional owning service account filter.
  optional string service_account_id = 3;
  // Search by title or secret name.
  optional string search = 4;
  // Requested page size; zero uses the default.
  int32 page_size = 5;
  // Opaque continuation token.
  string page_token = 6;
}

// ListSecretsResponse contains metadata only, never secret values.
message ListSecretsResponse {
  // Authorized metadata records.
  repeated Secret secrets = 1;
  // Continuation token, empty on the final page.
  string next_page_token = 2;
}

// GetSecretResponse contains metadata only.
message GetSecretRequest {
  // The project ID.
  string project_id = 1 [(google.api.field_behavior) = REQUIRED];
  // The stable secret ID.
  string secret_id = 2 [(google.api.field_behavior) = REQUIRED];
}

// GetSecretResponse contains metadata only.
message GetSecretResponse {
  // The secret metadata.
  Secret secret = 1;
}

// Secret describes a stored secret without exposing its content.
message Secret {
  // The stable secret ID.
  string id = 1;
  // Human-readable display metadata.
  google.protobuf.Value meta = 2;
  // The component-owned secret name, when present.
  optional string name = 3;
  // The system-owned secret name, when present.
  optional string system_name = 4;
  // The owning instance state ID, when present.
  optional string state_id = 5;
  // The owning service account ID, when present.
  optional string service_account_id = 6;
}

// GetInstanceSecretsRequest selects a unit instance by stable state ID.
message GetInstanceSecretsRequest {
  // The project ID.
  string project_id = 1 [(google.api.field_behavior) = REQUIRED];
  // The stable state ID.
  string state_id = 2 [(google.api.field_behavior) = REQUIRED];
}

// GetInstanceSecretsResponse contains named JSON secret values.
message GetInstanceSecretsResponse {
  // The secret values by name.
  google.protobuf.Struct secrets = 1;
}

// UpdateInstanceSecretsRequest patches named unit secret values.
message UpdateInstanceSecretsRequest {
  // The project ID.
  string project_id = 1 [(google.api.field_behavior) = REQUIRED];
  // The stable state ID.
  string state_id = 2 [(google.api.field_behavior) = REQUIRED];
  // Supplied values replace matching names; omitted names are preserved.
  google.protobuf.Struct secrets = 3 [(google.api.field_behavior) = REQUIRED];
}

// UpdateInstanceSecretsResponse acknowledges the update without echoing secrets.
message UpdateInstanceSecretsResponse {}
