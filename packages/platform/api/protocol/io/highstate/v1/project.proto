syntax = "proto3";
package io.highstate.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

// ProjectMeta contains display metadata for a project.
message ProjectMeta {
  // The human-readable project title.
  string title = 1;

  // The optional project description.
  optional string description = 2;

  // The optional Iconify icon identifier.
  optional string icon = 3;

  // The optional display color of the icon.
  optional string icon_color = 4;
}

// Project describes the project selected by the authenticated request.
message Project {
  // The stable project ID.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The project name.
  string name = 2;

  // The project display metadata.
  ProjectMeta meta = 3;

  // The ID of the project space containing the project.
  string space_id = 4 [(google.api.field_behavior) = IMMUTABLE];

  // The ID of the project model storage.
  string model_storage_id = 5 [(google.api.field_behavior) = IMMUTABLE];

  // The legacy backend-scoped library ID, superseded by project package selections.
  string library_id = 6 [deprecated = true];

  // The legacy Pulumi backend ID, superseded by pulumi_state_backend_id.
  string pulumi_backend_id = 7 [deprecated = true];

  // The time when the project was created.
  google.protobuf.Timestamp created_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The time when the project was last updated.
  google.protobuf.Timestamp updated_at = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The ID of the container runtime used for every project workload.
  string container_runtime_id = 10;

  // The ID of the Pulumi state backend.
  string pulumi_state_backend_id = 11;
}

// GetProjectRequest requests one project.
message GetProjectRequest {
  // The project ID.
  string project_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// GetProjectResponse returns the canonical project and whether it is locked.
message GetProjectResponse {
  // The canonical project.
  Project project = 1 [(google.api.field_behavior) = REQUIRED];

  // Whether the project is currently locked.
  bool is_locked = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ListProjectsRequest requests a page of projects visible to the authenticated backend API key.
message ListProjectsRequest {
  // The maximum number of projects to return.
  optional int32 page_size = 1;

  // The opaque continuation token returned by a previous request.
  optional string page_token = 2;
}

// ProjectEntry contains one project and its current lock state.
message ProjectEntry {
  // The canonical project.
  Project project = 1 [(google.api.field_behavior) = REQUIRED];

  // Whether the project is currently locked.
  bool is_locked = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ListProjectsResponse returns a page of projects.
message ListProjectsResponse {
  // The projects in this page.
  repeated ProjectEntry projects = 1;

  // The opaque continuation token for the next page.
  optional string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// UpdateProjectPlacementRequest selects runtime and state storage for future project work.
message UpdateProjectPlacementRequest {
  // The project ID.
  string project_id = 1 [(google.api.field_behavior) = REQUIRED];

  // The runtime used for every project workload.
  string container_runtime_id = 2 [(google.api.field_behavior) = REQUIRED];

  // The Pulumi state backend used by the project.
  string pulumi_state_backend_id = 3 [(google.api.field_behavior) = REQUIRED];

  // Explicitly enables or disables the local development overlay during migration.
  optional bool local_overlay_enabled = 4;
}

// UpdateProjectPlacementResponse returns the canonical project placement.
message UpdateProjectPlacementResponse {
  // The updated project.
  Project project = 1 [(google.api.field_behavior) = REQUIRED];
}

// ProjectUnlockMethod contains client-prepared credentials for a new project.
message ProjectUnlockMethod {
  // The unlock method type: password or passkey.
  string type = 1 [(google.api.field_behavior) = REQUIRED];

  // Display metadata for the unlock method. The title is required.
  ProjectMeta meta = 2 [(google.api.field_behavior) = REQUIRED];

  // The AGE recipient used to encrypt the project keys.
  string recipient = 3 [(google.api.field_behavior) = REQUIRED];

  // The AGE identity encrypted by the client with the password or passkey.
  string encrypted_identity = 4 [(google.api.field_behavior) = REQUIRED];

  // The opaque passkey identity, required for passkey methods.
  optional string passkey_identity = 5;
}

// CreateProjectRequest creates a project using backend API key authorization.
message CreateProjectRequest {
  // The project definition. Omitted placement IDs use backend defaults.
  Project project = 1 [(google.api.field_behavior) = REQUIRED];

  // The initial client-prepared unlock method.
  ProjectUnlockMethod unlock_method = 2 [(google.api.field_behavior) = REQUIRED];

  // An optional client-reserved CUID2 project ID. Otherwise the backend generates it.
  optional string project_id = 3;
}

// CreateProjectResponse returns the created, initially unlocked project.
message CreateProjectResponse {
  // The canonical project.
  Project project = 1 [(google.api.field_behavior) = REQUIRED];
}

// UnlockProjectRequest unlocks a project using backend API key authorization.
message UnlockProjectRequest {
  // The project ID.
  string project_id = 1 [(google.api.field_behavior) = REQUIRED];

  // The AGE identity decrypted by the client. May be empty when encryption is disabled.
  string decrypted_identity = 2 [(google.api.field_behavior) = REQUIRED];
}

// UnlockProjectResponse confirms that the project is unlocked.
message UnlockProjectResponse {}

// ProjectService provides access to projects.
service ProjectService {
  // Creates an initially unlocked project and bootstraps its library selection.
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);

  // Unlocks a project, including after a backend restart.
  rpc UnlockProject(UnlockProjectRequest) returns (UnlockProjectResponse);

  // Gets one project and whether it is currently locked.
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);

  // Lists projects visible to the authenticated backend API key.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);

  // Changes project placement when no active work prevents migration.
  rpc UpdateProjectPlacement(UpdateProjectPlacementRequest) returns (UpdateProjectPlacementResponse);
}
