syntax = "proto3";
package io.highstate.panel.v1;

import "google/protobuf/struct.proto";

message Panel {
  // The name of the panel unique within the unit instance and worker.
  string name = 1;

  // The display metadata of the panel (title, description, icon, iconColor).
  google.protobuf.Struct meta = 2;
}

message SetUnitPanelsRequest {
  // The ID of the worker version serving the panels.
  string worker_version_id = 1;

  // The ID of the concrete worker instance serving the panels.
  string worker_instance_id = 2;

  // The ID of the unit state the panels are attached to.
  string state_id = 3;

  // The complete set of panels currently served for the unit.
  repeated Panel panels = 4;
}

message SetUnitPanelsResponse {
  // Stable panel IDs in the same order as the request panels.
  repeated string panel_ids = 1;
}

service PanelService {
  // Replaces the web panels served by a worker for a unit instance.
  rpc SetUnitPanels(SetUnitPanelsRequest) returns (SetUnitPanelsResponse);
}
