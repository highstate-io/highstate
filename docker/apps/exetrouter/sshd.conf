Port 2222
ListenAddress 0.0.0.0
HostKey /ssh/ssh_host_ed25519_key
PidFile /run/sshd/exetrouter.pid
AllowUsers routercli
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthorizedKeysFile none
AuthorizedKeysCommand /usr/bin/cat /run/exetrouter/authorized_keys
AuthorizedKeysCommandUser routercli
PermitRootLogin no
StrictModes yes
DisableForwarding yes
PermitTTY no
PermitUserEnvironment no
PermitUserRC no
UsePAM no
LogLevel INFO
