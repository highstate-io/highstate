name: PR Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/highstate-io/dev
  IMAGE_TAG: pr-${{ github.event.pull_request.number }}

jobs:
  build-images:
    name: Build preview images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: true

      - name: Fetch base branch
        run: git fetch 'https://github.com/${{ github.repository }}.git' '${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}'

      - name: Checkout trusted image selector
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-checkout
          persist-credentials: false

      - name: Isolate trusted image selector
        run: mv trusted-checkout /tmp/highstate-trusted

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare
        run: |
          bun install --frozen-lockfile
          bun run ci:prepare

      - name: Select affected images
        id: images
        run: |
          mkdir -p preview-images
          targets=$(bun /tmp/highstate-trusted/scripts/affected-image-targets.ts --root . --base origin/main --head '${{ github.event.pull_request.head.sha }}' --output preview-images/affected-images.json)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Build OCI archives
        if: steps.images.outputs.targets != ''
        env:
          TAGS: ${{ env.IMAGE_TAG }}
          PLATFORMS: linux/amd64,linux/arm64
        run: |
          bun nx run docker-images:prepare-images
          docker buildx bake --file docker/docker-bake.hcl images --print > preview-bake.json
          outputs=()
          for target in ${{ steps.images.outputs.targets }}; do
            outputs+=(--set "$target.output=type=oci,dest=preview-images/$target.tar")
          done
          docker buildx bake --file docker/docker-bake.hcl ${{ steps.images.outputs.targets }} "${outputs[@]}"

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: preview-images
          path: preview-images
          retention-days: 1

      - name: Record archive image digests
        env:
          TAGS: ${{ env.IMAGE_TAG }}
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          docker buildx bake --file /tmp/highstate-trusted/docker/docker-bake.hcl images --print > trusted-bake.json
          jq --argjson targets "$(jq '.targets' preview-images/affected-images.json)" '.group.images.targets = $targets' trusted-bake.json > selected-bake.json
          bun scripts/sync-repository-images.ts --root /tmp/highstate-trusted --prefix "$IMAGE_PREFIX" --tag "$IMAGE_TAG" --bake selected-bake.json --oci-directory preview-images --output published-images.json

      - name: Upload image metadata
        uses: actions/upload-artifact@v4
        with:
          name: published-images
          path: published-images.json
          retention-days: 1

  publish-packages:
    name: Publish preview packages
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: true

      - name: Fetch base branch
        run: git fetch 'https://github.com/${{ github.repository }}.git' '${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}'

      - name: Checkout trusted package selector
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-checkout
          persist-credentials: false

      - name: Isolate trusted package selector
        run: |
          mv trusted-checkout /tmp/highstate-trusted
          git status --porcelain

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare
        run: |
          bun install --frozen-lockfile
          bun run ci:prepare

      - name: Download published image metadata
        uses: actions/download-artifact@v4
        with:
          name: published-images
          path: metadata

      - name: Synchronize image references
        run: |
          bun /tmp/highstate-trusted/scripts/apply-repository-images.ts \
            --root . \
            --metadata metadata/published-images.json

      - name: Select and build affected packages
        id: packages
        run: |
          paths=$(bun /tmp/highstate-trusted/scripts/affected-package-paths.ts --root . --trusted-root /tmp/highstate-trusted --base origin/main --head '${{ github.event.pull_request.head.sha }}' --output affected-packages.json)
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
          if [ -n "$paths" ]; then bun nx run-many -t build --projects="$(jq -r 'map(.name) | join(",")' affected-packages.json)"; fi

      - name: Prepare package manifests
        if: steps.packages.outputs.paths != ''
        run: bun /tmp/highstate-trusted/scripts/prepare-preview-packages.ts --root . --trusted-root /tmp/highstate-trusted --metadata affected-packages.json --preview-version '0.0.0-preview-${{ github.event.pull_request.head.sha }}'

      - name: Pack packages
        if: steps.packages.outputs.paths != ''
        run: |
          mkdir preview-packages
          for path in ${{ steps.packages.outputs.paths }}; do
            bun pm pack --cwd "$path" --destination "$GITHUB_WORKSPACE/preview-packages"
          done

      - name: Publish packages
        if: steps.packages.outputs.paths != ''
        run: bun run pkg-pr-new publish --comment=off --packageManager=bun --no-template --no-compact --json=package-metadata.json preview-packages/*.tgz

      - name: Write empty package metadata
        if: steps.packages.outputs.paths == ''
        run: printf '{"packages":[],"templates":[]}' > package-metadata.json

      - name: Upload preview metadata
        uses: actions/upload-artifact@v4
        with:
          name: preview-metadata
          path: package-metadata.json
          retention-days: 1
