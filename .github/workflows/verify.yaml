name: Verify

on: [ pull_request ]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch all tags
        run: git fetch --unshallow --tags

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install affected verification tools
        run: |
          affected_projects="$(bun nx show projects --affected --base=origin/main --with-target=check --json | jq -r '.[]')"
          tools_dir="$RUNNER_TEMP/verification-tools"
          mkdir -p "$tools_dir"

          if grep -qxE '@highstate/docs|dev-docs' <<< "$affected_projects"; then
            curl -fsSL -o "$tools_dir/rumdl.tar.gz" \
              https://github.com/rvben/rumdl/releases/download/v0.1.86/rumdl-v0.1.86-x86_64-unknown-linux-gnu.tar.gz
            echo "2f411532ab0aac40b2c4c9b5b70cb96061f274771e846dcf6f6d6fe4469b74af  $tools_dir/rumdl.tar.gz" \
              | sha256sum --check --strict --status -
            tar -xzf "$tools_dir/rumdl.tar.gz" -C "$tools_dir" rumdl

            curl -fsSL -o "$tools_dir/vale.tar.gz" \
              https://github.com/errata-ai/vale/releases/download/v3.14.1/vale_3.14.1_Linux_64-bit.tar.gz
            echo "ff2b49ffaa9dcd246fd5008f03ff67746d2790b75bf4d3657e2fb9530fb96db3  $tools_dir/vale.tar.gz" \
              | sha256sum --check --strict --status -
            tar -xzf "$tools_dir/vale.tar.gz" -C "$tools_dir" vale
          fi

          if grep -qx 'dev-docs' <<< "$affected_projects"; then
            curl -fsSL -o "$tools_dir/lychee.tar.gz" \
              https://github.com/lycheeverse/lychee/releases/download/lychee-v0.23.0/lychee-x86_64-unknown-linux-gnu.tar.gz
            echo "1fcb6ccf10d04c22b8c5873c5b9cb7be32ee7423e12169d6f1a79a6f1962ef81  $tools_dir/lychee.tar.gz" \
              | sha256sum --check --strict --status -
            tar -xzf "$tools_dir/lychee.tar.gz" -C "$tools_dir" lychee
          fi

          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Prepare
        run: bun run ci:prepare

      - name: Verify
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: bun run ci:verify
