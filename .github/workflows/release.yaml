name: Release

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/highstate-io

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip') &&
      !contains(github.event.head_commit.message, 'skip ci')"
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write # needed for provenance data generation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          submodules: true

      - name: Fetch all tags
        run: git fetch --unshallow --tags

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure image build
        run: |
          {
            echo "TAGS=latest,${GITHUB_SHA::7}"
            echo "PLATFORMS=linux/amd64,linux/arm64"
            echo "CACHE_REPOSITORY=ghcr.io/highstate-io/dev/build-cache"
          } >> "$GITHUB_ENV"

      - name: Run release tasks
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: |
          bunx nx-cloud start-ci-run --no-distribution
          bun run ci:prepare
          bun run ci:release
          bunx nx-cloud stop-all-agents

      - name: Synchronize production image references
        id: images
        run: |
          docker buildx bake --file docker/docker-bake.hcl images --print > trusted-bake.json
          bun scripts/sync-repository-images.ts \
            --prefix "$IMAGE_PREFIX" \
            --tag latest \
            --bake trusted-bake.json \
            --output image-metadata.json

      - name: Commit image references
        id: image-commit
        run: |
          if git diff --quiet -- 'packages/**/assets/images.json'; then exit 0; fi
          git add -- 'packages/**/assets/images.json'
          git commit -m 'chore: update release image hashes [skip ci]'
          git push origin HEAD:main

      - name: Rebuild packages affected by image references
        if: steps.image-commit.outcome == 'success'
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            bun nx affected --base="$GITHUB_SHA" --head=HEAD -t build
          fi

      - name: Publish packages
        run: bun nx release -y || echo "Failed to publish packages, but continuing to deploy docs"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/platform/docs/.output/public

      - name: Deploy docs to GitHub Pages
        id: deploy-docs
        uses: actions/deploy-pages@v4
