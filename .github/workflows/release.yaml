name: Release

on:
  workflow_dispatch:
    inputs:
      retry_existing_version:
        description: Publish the current package versions without consuming changesets
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/highstate-io

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write # needed for provenance data generation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          submodules: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate pending changesets
        if: inputs.retry_existing_version == false
        run: |
          bun run changesets:check
          bun run release-groups:check
          bun run changeset status --output changeset-status.json
          if [ "$(jq '.releases | length' changeset-status.json)" -eq 0 ]; then
            echo "No pending changesets to release" >&2
            exit 1
          fi
          rm changeset-status.json

      - name: Calculate package versions
        if: inputs.retry_existing_version == false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release:version

      - name: Configure image build
        if: inputs.retry_existing_version == false
        run: |
          {
            echo "TAGS=latest,${GITHUB_SHA::7}"
            echo "PLATFORMS=linux/amd64,linux/arm64"
            echo "CACHE_REPOSITORY=ghcr.io/highstate-io/dev/build-cache"
          } >> "$GITHUB_ENV"

      - name: Run release tasks
        if: inputs.retry_existing_version == false
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: |
          bunx nx-cloud start-ci-run --no-distribution
          bun run ci:prepare
          bun run ci:release
          bunx nx-cloud stop-all-agents

      - name: Verify retry
        if: inputs.retry_existing_version
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: |
          bunx nx-cloud start-ci-run --no-distribution
          bun run release:lockfile
          bun run ci:prepare
          bun run release-groups:check
          bun nx run-many -t test,build,biome:check,typecheck
          bunx nx-cloud stop-all-agents

      - name: Synchronize production image references
        if: inputs.retry_existing_version == false
        run: |
          docker buildx bake --file docker/docker-bake.hcl images --print > trusted-bake.json
          bun scripts/sync-repository-images.ts \
            --prefix "$IMAGE_PREFIX" \
            --tag latest \
            --bake trusted-bake.json \
            --output image-metadata.json
          rm trusted-bake.json image-metadata.json

      - name: Commit image references
        if: inputs.retry_existing_version == false
        run: |
          git add --all
          git commit -m 'chore(release): publish packages [skip ci]'
          git push origin HEAD:main

      - name: Rebuild packages affected by image references
        if: inputs.retry_existing_version == false
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            bun nx affected --base="$GITHUB_SHA" --head=HEAD -t build
          fi

      - name: Publish packages
        run: |
          set +e
          bun run release:publish
          publish_status=$?
          git push origin --follow-tags
          exit "$publish_status"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Deprecate accidental platform v1 releases
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-recovery.npmrc
        run: |
          if [ "$(jq -r '.version' packages/platform/contract/package.json)" != "0.32.0" ]; then
            exit 0
          fi
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$NPM_CONFIG_USERCONFIG"
          mapfile -t packages < <(jq -r '.fixed[0][]' .changeset/config.json)
          for package in "${packages[@]}"; do
            npm view "$package@0.32.0" version --registry=https://registry.npmjs.org
          done
          for package in "${packages[@]}"; do
            npm deprecate "$package@>=1.0.0 <2.0.0" \
              'Tainted release: the v1 version line was published accidentally. Use the v0 release line (0.32.0 or newer), which retains the current code and restores pre-1.0 versioning.' \
              --registry=https://registry.npmjs.org
            npm dist-tag add "$package@0.32.0" latest --registry=https://registry.npmjs.org
          done

      - name: Create GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release:github

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/platform/docs/.output/public

      - name: Deploy docs to GitHub Pages
        id: deploy-docs
        uses: actions/deploy-pages@v4
