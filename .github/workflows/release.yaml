name: Release

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip') &&
      !contains(github.event.head_commit.message, 'skip ci')"
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write # needed for provenance data generation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          submodules: true

      - name: Fetch all tags
        run: git fetch --unshallow --tags

      - name: Install Nix
        uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1

      - name: Configure devenv cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv

      - name: Install devenv
        run: |
          devenv_rev="$(jq -r '.nodes.devenv.locked.rev' devenv.lock)"
          nix profile add "github:cachix/devenv/${devenv_rev}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build CI environment
        run: devenv shell --profile ci -- true

      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.13-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        shell: devenv shell --profile ci bash -- -e {0}
        run: bun install --frozen-lockfile --prefer-offline

      - name: Configure image build
        run: |
          echo "TAGS=latest,${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "PLATFORMS=linux/amd64,linux/arm64" >> "$GITHUB_ENV"
          echo "CACHE_REPOSITORY=ghcr.io/highstate-io/highstate/build-cache" >> "$GITHUB_ENV"

      - name: Run release tasks
        shell: devenv shell --profile ci bash -- -e {0}
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: |
          bunx nx-cloud start-ci-run --no-distribution
          bun run ci:prepare
          bun run ci:release
          bunx nx-cloud stop-all-agents

      - name: Publish packages
        shell: devenv shell --profile ci bash -- -e {0}
        run: bun nx release -y || echo "Failed to publish packages, but continuing to deploy docs"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/platform/docs/.output/public

      - name: Deploy docs to GitHub Pages
        id: deploy-docs
        uses: actions/deploy-pages@v4
