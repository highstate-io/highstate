name: E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  browser:
    name: API, CLI, and browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare workspace CLI
        run: bun run ci:prepare
      - name: Install Chromium
        run: bun run --cwd packages/e2e --bun playwright install --with-deps chromium
      - name: Allow Chromium sandbox user namespaces
        run: |
          sudo tee /etc/apparmor.d/highstate-e2e-chromium > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile highstate-e2e-chromium /home/runner/.cache/ms-playwright/**/chrome-headless-shell flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/highstate-e2e-chromium
      - name: Install Pulumi CLI
        uses: pulumi/actions@v6
        with:
          pulumi-version: 3.232.0
      - name: Build and verify API, CLI, and browser
        run: bun run --bun --filter @highstate/e2e test:e2e
      - name: Upload sanitized test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-browser-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
          path: |
            .artifacts/e2e/**/*.json
            .artifacts/e2e/**/*.png
