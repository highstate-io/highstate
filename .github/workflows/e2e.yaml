name: E2E

on:
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  changes:
    name: Runtime paths
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.paths.outputs.runtime }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect runtime changes
        if: github.event_name == 'pull_request'
        id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            runtime:
              - 'packages/e2e/**'
              - 'packages/platform/**'
              - 'scripts/**'
              - '.github/workflows/e2e.yaml'
              - 'package.json'
              - 'bun.lock'
              - 'nx.json'
              - '*tsconfig*.json'
              - 'devenv.*'
              - '.dockerignore'

  lifecycle:
    name: Docker lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare workspace CLI
        run: bun run ci:prepare

      - name: Verify Docker prerequisites
        run: |
          docker info
          openssl version

      - name: Verify lifecycle
        run: bun run --bun --filter @highstate/e2e test:e2e

      - name: Verify Designer workload services
        env:
          HIGHSTATE_E2E_REUSE_RUNNER: '1'
        run: bun run --bun --filter @highstate/e2e test:services

      - name: Verify local Docker conformance
        if: ${{ !cancelled() }}
        env:
          HIGHSTATE_E2E_RUNTIME: local-docker
        run: bun run --bun --filter @highstate/e2e test:conformance

      - name: Upload sanitized lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-lifecycle-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
          path: |
            .artifacts/e2e/**/*.json
            .artifacts/e2e/**/*.log
            !.artifacts/e2e/**/*secret*
            !.artifacts/e2e/**/*credential*
            !.artifacts/e2e/**/*token*
            !.artifacts/e2e/**/*kubeconfig*
            !.artifacts/e2e/**/*key*
            !.artifacts/e2e/**/*.db*
            !.artifacts/e2e/**/*.sqlite*

  browser:
    name: Production Designer browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare workspace CLI
        run: bun run ci:prepare

      - name: Install Chromium and system dependencies
        run: bun run --cwd packages/e2e --bun playwright install --with-deps chromium

      - name: Build and verify production Designer
        run: bun packages/e2e/src/browser/run.ts

      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-browser-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: .artifacts/e2e/browser-*/result.json

  conformance:
    name: Runtime (${{ matrix.runtime }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [remote-docker, kubernetes]
    env:
      HIGHSTATE_E2E_RUNTIME: ${{ matrix.runtime }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare workspace CLI
        run: bun run ci:prepare

      - name: Build runtime products
        run: bunx --bun nx run @highstate/backend:build

      - name: Install kind
        if: matrix.runtime == 'kubernetes'
        run: |
          tools_dir="$RUNNER_TEMP/e2e-tools"
          mkdir -p "$tools_dir"
          curl --fail --location --retry 3 \
            https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64 -o "$tools_dir/kind"
          echo "a6875aaea358acf0ac07786b1a6755d08fd640f4c79b7a2e46681cc13f49a04b  $tools_dir/kind" \
            | sha256sum --check --strict
          chmod +x "$tools_dir/kind"
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Verify runtime prerequisites
        run: |
          docker info
          if [ "$HIGHSTATE_E2E_RUNTIME" = kubernetes ]; then
            kind version
            kubectl version --client
          fi

      - name: Verify runtime conformance
        run: bun run --bun --filter @highstate/e2e test:conformance

      - name: Upload sanitized runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.runtime }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
          path: |
            .artifacts/e2e/**/*.json
            .artifacts/e2e/**/*.log
            !.artifacts/e2e/**/*secret*
            !.artifacts/e2e/**/*credential*
            !.artifacts/e2e/**/*token*
            !.artifacts/e2e/**/*kubeconfig*
            !.artifacts/e2e/**/*key*
            !.artifacts/e2e/**/*.db*
            !.artifacts/e2e/**/*.sqlite*
